name: project_flutter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  geolocator: ^14.0.3  
  google_fonts: ^8.2.1
  url_launcher: ^6.3.2
  dash_chat_2: ^0.0.21
  google_generative_ai: ^0.4.7
  shared_preferences: ^2.5.5

# dash_chat_2 0.0.21 يثبّت intl ^0.19.0 بينما flutter_localizations يطلب
# ^0.20.3، فيتعذّر حلّ التبعيات. الحزمة لا تستعمل من intl سوى DateFormat
# بأنماط بسيطة ('HH:mm' وأخواتها)، وهي واجهة لم تتغيّر بين الإصدارين،
# فالتجاوز هنا آمن ويُزال متى حدّثت الحزمة قيدها.
dependency_overrides:
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    # خط الواجهة العام — ثمانية سانس
    - family: ThmanyahSans
      fonts:
        - asset: assets/fonts/thmanyahsans-Light.otf
          weight: 300
        - asset: assets/fonts/thmanyahsans-Regular.otf
          weight: 400
        - asset: assets/fonts/thmanyahsans-Medium.otf
          weight: 500
        - asset: assets/fonts/thmanyahsans-Bold.otf
          weight: 700
        - asset: assets/fonts/thmanyahsans-Black.otf
          weight: 900

    # خط العناوين الفاخر — ثمانية سيرف ديسبلاي
    - family: ThmanyahSerifDisplay
      fonts:
        - asset: assets/fonts/thmanyahserifdisplay-Light.otf
          weight: 300
        - asset: assets/fonts/thmanyahserifdisplay-Regular.otf
          weight: 400
        - asset: assets/fonts/thmanyahserifdisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/thmanyahserifdisplay-Bold.otf
          weight: 700
        - asset: assets/fonts/thmanyahserifdisplay-Black.otf
          weight: 900

# أيقونة التطبيق مولّدة من شعار "المعزب" الرسمي.
flutter_launcher_icons:
  image_path: assets/images/app_logo.png
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  adaptive_icon_background: "#FAF3E5"
  adaptive_icon_foreground: assets/images/app_logo.png
